# Owns the GitHub Release for a v* tag. Creates it as a draft, calls each build
# workflow so it can attach its own assets, then publishes it once they all pass.
# The build workflows stay independently runnable; they just upload when asked to.
name: Release

on:
  # Push a tag to cut a release: git tag v0.4.0 && git push origin v0.4.0
  push:
    tags: ["v*"]

  # Re-runnable from the Actions tab by picking the tag in the ref selector
  workflow_dispatch:

# Never cancel a release mid-upload; let a superseded run finish
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject non-tag refs
        if: github.ref_type != 'tag'
        run: |
          echo "::error::This workflow releases a tag, but it ran on ${{ github.ref_type }} '${{ github.ref_name }}'."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # Asset filenames come from package.json, so a mismatch would publish
      # dash-web-0.3.0.zip under a v0.4.0 release. Fail before spending build time.
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, reusing it."
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  # Each build workflow runs at the same commit as this one (the tag) and uploads
  # its own assets. Add another builder here and it needs no release logic of its own.
  web:
    name: Static web bundle
    needs: create
    permissions:
      contents: write
    uses: ./.github/workflows/web-static.yml
    with:
      release_tag: ${{ github.ref_name }}

  electron:
    name: Desktop installers
    needs: create
    permissions:
      contents: write
    uses: ./.github/workflows/electron.yml
    with:
      release_tag: ${{ github.ref_name }}

  # No `if: always()`: if a build failed the release stays a draft with whatever
  # did upload, so it can be inspected and re-run rather than published half-empty.
  publish:
    name: Publish release
    needs: [web, electron]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
